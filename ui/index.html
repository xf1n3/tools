<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#080a0e">
<title>MCBE UI Studio — Standalone</title>
<style>
:root{--bg:#080a0e;--panel:#10141a;--panel2:#151b22;--line:#29313b;--txt:#edf2f7;--muted:#8d98a5;--blue:#5c9dff;--good:#79df91;--bad:#ff817b}*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}button,input,select,textarea{font:inherit}button{color:inherit}.app{height:100dvh;display:grid;grid-template-rows:54px 1fr}.top{display:flex;align-items:center;justify-content:space-between;padding:6px 9px;border-bottom:1px solid var(--line);background:#0c0f13;z-index:20}.brand{display:flex;gap:9px;align-items:center}.logo{width:34px;height:34px;border-radius:9px;background:#182331;display:grid;place-items:center;font-weight:800;font-size:10px}.brand b{font-size:13px}.brand small{display:block;color:var(--muted);font-size:9px;margin-top:2px}.actions{display:flex;gap:5px}.btn{border:1px solid var(--line);background:#171c22;border-radius:7px;padding:7px 9px;font-size:10px;cursor:pointer}.btn.primary{background:#17335c;border-color:#3c73c2}.btn input{display:none}.layout{min-height:0;display:grid;grid-template-columns:230px minmax(300px,1fr) minmax(360px,1.15fr)}.side,.editor,.preview{min-width:0;min-height:0}.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}.sideTabs{display:flex;border-bottom:1px solid var(--line)}.sideTabs button{flex:1;border:0;background:transparent;padding:9px;color:var(--muted);font-size:10px}.sideTabs button.active{color:#fff;background:var(--panel2)}.sidePanel{display:none;flex:1;min-height:0;flex-direction:column}.sidePanel.active{display:flex}.search{padding:7px;border-bottom:1px solid var(--line);display:flex;gap:5px}.search input{flex:1;min-width:0;background:#090c10;border:1px solid var(--line);border-radius:6px;padding:6px 8px;color:#fff;font-size:10px;outline:none}.tree{overflow:auto;padding:5px;flex:1}.row{padding:5px 7px;border-radius:5px;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}.row:hover,.row.active{background:#193354}.dir{color:#aeb8c2}.meta{border-top:1px solid var(--line);padding:7px;color:var(--muted);font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.textures{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:5px;overflow:auto}.tex{border:1px solid var(--line);border-radius:6px;padding:4px;background:#090c10}.tex img{width:100%;aspect-ratio:1;object-fit:contain;image-rendering:pixelated;background:#222}.tex span{display:block;font-size:8px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.editor{border-right:1px solid var(--line);display:flex;flex-direction:column}.editorTop,.previewTop{height:40px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:var(--panel)}.tabs{display:flex;overflow:auto}.tab{padding:11px 10px;font-size:9px;color:var(--muted);border-right:1px solid var(--line);white-space:nowrap}.tab.active{color:#fff;background:#171c22}.edBtns{display:flex;gap:4px;padding:4px}.edBtns button,.devices button{border:1px solid var(--line);background:#171c22;border-radius:6px;padding:5px 7px;font-size:9px}.codeWrap{display:flex;flex:1;min-height:0;background:#090c10}.nums{width:40px;flex:0 0 40px;padding:13px 7px;text-align:right;color:#4f5a67;font:10px/1.55 ui-monospace,monospace;overflow:hidden;user-select:none}.code{flex:1;border:0;outline:0;resize:none;background:transparent;color:#dce5ee;padding:13px 8px 13px 3px;font:10px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre;tab-size:2;overflow:auto}.status{height:25px;border-top:1px solid var(--line);padding:0 8px;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:8px}.ok{color:var(--good)}.bad{color:var(--bad)}.preview{background:#07090c;display:flex;flex-direction:column;position:relative}.previewTop{padding:0 8px;font-size:10px}.previewTop span{color:var(--muted);margin-left:5px;font-size:8px}.devices{display:flex;gap:3px}.devices button.active{border-color:var(--blue)}.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:12px;overflow:auto;background:radial-gradient(circle,#1b222b,#07090c 70%)}.game{position:relative;overflow:hidden;background:#7295a6;box-shadow:0 15px 50px #000,0 0 0 1px #343c46}.phone .game{width:390px;height:844px;max-width:94%;max-height:calc(100% - 5px)}.tablet .game{width:820px;height:1180px;max-width:94%;max-height:calc(100% - 5px)}.desktop .game{width:1280px;height:720px;max-width:94%;max-height:calc(100% - 5px)}.sky{position:absolute;inset:0;background:linear-gradient(#78a5bb 0 55%,#6b9253 55%)}.ground{position:absolute;inset:55% 0 0;background:linear-gradient(135deg,transparent 0 24%,#597d4a 24% 52%,transparent 52%),linear-gradient(45deg,transparent 0 32%,#4f7143 32% 69%,transparent 69%),#64874e}.cross{position:absolute;left:50%;top:50%;width:14px;height:14px;transform:translate(-50%,-50%)}.cross:before,.cross:after{content:"";position:absolute;background:#fff}.cross:before{width:14px;height:2px;top:6px}.cross:after{height:14px;width:2px;left:6px}.hud{position:absolute;inset:0;touch-action:none}.node{position:absolute;box-sizing:border-box;pointer-events:auto;touch-action:none}.inspect{outline:1px dashed transparent;outline-offset:2px}.selected{outline:2px solid #68a7ff!important;outline-offset:2px}.imgNode{background:rgba(30,35,42,.7);background-repeat:no-repeat;background-position:center;background-size:100% 100%;border:1px solid #ffffff18}.missing{display:flex;align-items:center;justify-content:center;color:#b9c2cc;font-size:8px;background:repeating-linear-gradient(45deg,#30363d,#30363d 5px,#252b31 5px,#252b31 10px)}.label{color:#fff;text-shadow:1px 1px 0 #000;font-weight:600;white-space:nowrap}.bar{height:9px;border:1px solid #000;background:#202328;overflow:hidden}.bar i{display:block;height:100%}.health i{background:#e33}.hunger i{background:#d68a2d}.armor i{background:#aeb8c5}.sim{border-top:1px solid var(--line);background:var(--panel);min-height:48px;padding:6px;display:flex;gap:9px;align-items:center;overflow-x:auto;white-space:nowrap;font-size:9px}.sim label{display:flex;align-items:center;gap:3px;color:var(--muted)}.sim input[type=text]{width:90px;background:#090c10;border:1px solid var(--line);color:#fff;border-radius:5px;padding:5px}.sim input[type=range]{width:65px}.inspector{position:absolute;z-index:1000;display:none;background:rgba(12,15,19,.98);border:1px solid #303944;box-shadow:0 20px 70px #000;border-radius:12px;overflow:auto}.inspector.open{display:block}.inspHead{position:sticky;top:0;background:#11161c;border-bottom:1px solid var(--line);padding:10px;display:flex;justify-content:space-between;align-items:center;font-size:11px}.inspHead button{background:none;border:0;color:#bbb;font-size:22px}.inspBody{padding:9px}.group{border-top:1px solid var(--line);padding-top:9px;margin-top:9px}.group>b{font-size:10px}.field{display:grid;grid-template-columns:65px 1fr;gap:6px;align-items:center;margin:6px 0;color:var(--muted);font-size:9px}.field input,.field select{width:100%;min-height:31px;background:#090c10;border:1px solid var(--line);border-radius:6px;color:#fff;padding:6px;font-size:10px;outline:none}.field input:focus,.field select:focus{border-color:var(--blue)}.jsonMini{font:8px/1.4 ui-monospace,monospace;white-space:pre-wrap;word-break:break-word;background:#090c10;border:1px solid var(--line);border-radius:6px;padding:7px;color:#cbd5df}.hint{position:absolute;left:50%;bottom:20%;transform:translateX(-50%);z-index:300;background:#0009;padding:6px 9px;border-radius:999px;font-size:8px;pointer-events:none}.empty{padding:18px;color:var(--muted);font-size:10px;text-align:center}
@media(max-width:950px){.layout{grid-template-columns:1fr}.side,.editor{display:none}.previewTop{height:48px}.stage{padding:6px 4px 58px}.phone .game{width:min(390px,94vw);height:min(844px,calc(100dvh - 170px));max-width:none;max-height:none}.sim{position:absolute;left:0;right:0;bottom:0;z-index:900;min-height:58px}.inspector{left:7px;right:7px;bottom:62px;top:auto;max-height:54dvh;border-radius:16px}.inspHead{padding:12px}.inspHead button{font-size:25px}.field input,.field select{min-height:38px;font-size:12px}.top{height:52px}.actions .btn.folder{display:none}.brand small{display:none}.hint{bottom:22%}}
@media(max-width:520px){.devices button:nth-child(2),.devices button:nth-child(3){display:none}.actions .btn.export{display:none}.logo{width:30px;height:30px}.brand b{font-size:12px}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand"><div class="logo">MC</div><div><b>MCBE UI Studio</b><small>Standalone • no npm • no build</small></div></div>
  <div class="actions">
    <label class="btn primary">📦 ZIP<input id="zipIn" type="file" accept=".zip,application/zip"></label>
    <label class="btn folder">📁 Folder<input id="folderIn" type="file" webkitdirectory directory multiple></label>
    <button class="btn export" id="export">⬇ Export ZIP</button>
  </div>
</header>
<main class="layout">
<aside class="side">
  <div class="sideTabs"><button class="active" data-side="files">Files</button><button data-side="textures">Textures</button></div>
  <section class="sidePanel active" id="files"><div class="search"><input id="search" placeholder="Search files…"><span id="count">0</span></div><div class="tree" id="tree"></div><div class="meta" id="meta">No pack loaded</div></section>
  <section class="sidePanel" id="textures"><div class="search"><input id="texSearch" placeholder="Search textures…"></div><div class="textures" id="texGrid"></div></section>
</aside>
<section class="editor">
  <div class="editorTop"><div class="tabs" id="tabs"></div><div class="edBtns"><button id="format">Format</button><button id="save">Save</button></div></div>
  <div class="codeWrap"><div class="nums" id="nums">1</div><textarea class="code" id="code" spellcheck="false" placeholder="Load a resource pack ZIP…"></textarea></div>
  <div class="status"><span id="status">Ready</span><span id="cursor">Ln 1, Col 1</span></div>
</section>
<section class="preview">
  <div class="previewTop"><div><b>Live Preview</b><span id="opened">—</span></div><div class="devices"><button class="active" data-mode="phone">iPhone</button><button data-mode="tablet">Tablet</button><button data-mode="desktop">Desktop</button><button id="full">⛶</button></div></div>
  <div class="stage phone" id="stage"><div class="game" id="game"><div class="sky"></div><div class="ground"></div><div class="cross"></div><div class="hud" id="hud"></div></div><div class="hint" id="hint">Tap HUD element • drag to move</div></div>
  <div class="sim"><label>Title <input id="title" type="text"></label><label>Actionbar <input id="action" type="text" value="HITMARKER"></label><label>❤ <input id="hp" type="range" min="0" max="20" value="18"><b id="hpv">18</b></label><label>🍗 <input id="food" type="range" min="0" max="20" value="16"><b id="foodv">16</b></label><label>🛡 <input id="armor" type="range" min="0" max="20" value="8"><b id="armorv">8</b></label></div>
  <div class="inspector" id="inspector"><div class="inspHead"><b id="inspTitle">Inspector</b><button id="close">×</button></div><div class="inspBody" id="inspBody">Tap an element.</div></div>
</section>
</main></div>
<script>
// MCBE UI Studio v5 — dependency-free ZIP reader/writer using browser APIs.
const $=s=>document.querySelector(s), files=new Map(), urls=new Map();let open=[],active=null,lastGood=null,selected=null,drag=null,timer;
const lower=s=>String(s).replaceAll('\\','/').replace(/^\/+/, '').replace(/^\.\//,'').toLowerCase();
const isJson=p=>/\.(json|jsonc)$/i.test(p), isImg=p=>/\.(png|jpe?g|webp|gif)$/i.test(p);
function revoke(){for(const u of urls.values())URL.revokeObjectURL(u);urls.clear()}
function blobUrl(p){p=lower(p);if(urls.has(p))return urls.get(p);const f=files.get(p);if(!f?.blob)return null;const u=URL.createObjectURL(f.blob);urls.set(p,u);return u}
function tex(t){let x=lower(t).replace(/\.png$/,'');for(const p of [x,x+'.png',x+'.jpg','textures/'+x,'textures/'+x+'.png','textures/'+x+'.jpg']){if(files.has(p))return blobUrl(p)}return null}
function strip(s){let o='',str=false,esc=false;for(let i=0;i<s.length;i++){let c=s[i],n=s[i+1];if(str){o+=c;if(esc)esc=false;else if(c==='\\')esc=true;else if(c==='"')str=false;continue}if(c==='"'){str=true;o+=c;continue}if(c==='/'&&n==='/'){while(i<s.length&&s[i]!=='\n')i++;o+='\n';continue}if(c==='/'&&n==='*'){i+=2;while(i<s.length&&!(s[i]==='*'&&s[i+1]==='/'))i++;i++;continue}o+=c}return o}
function parse(){return JSON.parse(strip($('#code').value))}
function num(v,parent){if(typeof v==='number')return v;if(Array.isArray(v))return Number(v[0])||0;if(typeof v!=='string')return 0;let m=v.trim().match(/^(-?[\d.]+)%$/);if(m)return parent*+m[1]/100;m=v.trim().match(/(-?[\d.]+)px/);if(m)return +m[1];m=v.trim().match(/^(-?[\d.]+)/);return m?+m[1]:0}
function pt(a,w,h){return ({top_left:[0,0],top_middle:[w/2,0],top_right:[w,0],middle_left:[0,h/2],center:[w/2,h/2],middle_right:[w,h/2],bottom_left:[0,h],bottom_middle:[w/2,h],bottom_right:[w,h]})[a]||[0,0]}
function box(d,pw,ph){const s=d.size||[0,0],w=num(s[0],pw),h=num(s[1],ph),a=pt(d.anchor_from,pw,ph),b=pt(d.anchor_to,w,h),o=d.offset||[0,0];return {x:a[0]-b[0]+num(o[0],pw),y:a[1]-b[1]+num(o[1],ph),w,h}}
function visible(d){if(!d.bindings)return true;for(const b of d.bindings||[]){const p=b.source_property_name||'';if(p.includes("'HITMARKER'"))return $('#action').value==='HITMARKER';if(p.includes("'HIT'"))return $('#action').value==='HIT'}return true}
function ref(v,defs){if(typeof v!=='string'||!v.includes('@'))return typeof v==='object'?v:{};return defs[v.split('@').pop()]||{}}
function add(parent,d,name,pw,ph,defs){if(!d||typeof d!=='object'||!visible(d))return;const e=document.createElement('div');e.className='node inspect';e.dataset.name=name;const b=box(d,pw,ph);e.style.cssText=`left:${b.x}px;top:${b.y}px;width:${Math.max(0,b.w)}px;height:${Math.max(0,b.h)}px;z-index:${d.layer??0};`;if(d.alpha!=null)e.style.opacity=d.alpha;if(d.type==='image'){e.classList.add('imgNode');const u=tex(d.texture||'');if(u)e.style.backgroundImage=`url("${u}")`;else{e.classList.add('missing');e.textContent=(d.texture||name).split('/').pop()}}else if(d.type==='label'){e.classList.add('label');e.textContent=d.text||name;e.style.fontSize=Math.max(8,num(d.font_size==='small'?11:d.font_size,20)*(+d.font_scale_factor||1))+'px';e.style.textAlign=d.text_alignment||'left'}else if(d.type==='custom'){const n=name.toLowerCase();if(/health|hunger|armor/.test(n)){const k=n.includes('health')?'health':n.includes('hunger')?'hunger':'armor';e.classList.add('bar',k);const i=document.createElement('i'),v=k==='health'?$('#hp').value:k==='hunger'?$('#food').value:$('#armor').value;i.style.width=(v/20*100)+'%';e.appendChild(i)}}parent.appendChild(e);attach(e,name);for(const item of d.controls||[]){const k=Object.keys(item)[0];if(k)add(e,ref(item[k],defs),k,b.w,b.h,defs)}}
function attach(e,name){e.addEventListener('pointerdown',ev=>{ev.stopPropagation();select(name);const h=find(name);drag={name,sx:ev.clientX,sy:ev.clientY,orig:Array.isArray(h?.def?.offset)?[...h.def.offset]:[0,0],moved:false};try{e.setPointerCapture(ev.pointerId)}catch{}});e.addEventListener('pointermove',ev=>{if(!drag||drag.name!==name)return;const dx=ev.clientX-drag.sx,dy=ev.clientY-drag.sy;if(Math.abs(dx)+Math.abs(dy)<2)return;drag.moved=true;const h=find(name);if(!h)return;h.def.offset=[Math.round(drag.orig[0]+dx),Math.round(drag.orig[1]+dy)];$('#code').value=JSON.stringify(lastGood,null,2);save();render()});e.addEventListener('pointerup',()=>{if(drag?.moved)showInspector();drag=null})}
function find(root,name,path=[]){if(!root||typeof root!=='object')return null;if(Object.prototype.hasOwnProperty.call(root,name)&&root[name]&&typeof root[name]==='object')return {path:[...path,name],def:root[name]};for(const [k,v] of Object.entries(root)){if(v&&typeof v==='object'){const x=find(v,name,[...path,k]);if(x)return x}}return null}
function select(name){const el=[...$('#hud').querySelectorAll('.inspect')].find(x=>x.dataset.name===name);if(!el)return;$('#hud').querySelectorAll('.selected').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');selected=el;$('#inspector').classList.add('open');showInspector()}
function field(parent,label,val,cb,type='number'){const r=document.createElement('label');r.className='field';r.innerHTML=`<span>${label}</span><input type="${type}" value="${val??''}">`;r.querySelector('input').oninput=e=>cb(e.target.value);parent.appendChild(r)}
function selectField(parent,label,val,opts,cb){const r=document.createElement('label');r.className='field';r.innerHTML=`<span>${label}</span><select>${opts.map(x=>`<option ${x===val?'selected':''}>${x}</option>`).join('')}</select>`;r.querySelector('select').onchange=e=>cb(e.target.value);parent.appendChild(r)}
function commit(cb){const h=find(lastGood,selected?.dataset.name);if(!h)return;cb(h.def);$('#code').value=JSON.stringify(lastGood,null,2);save();render();requestAnimationFrame(()=>select(selected.dataset.name))}
function showInspector(){const body=$('#inspBody'),h=selected&&find(lastGood,selected.dataset.name);if(!h){body.textContent='Tap an element.';return}const d=h.def||{},o=Array.isArray(d.offset)?d.offset:[0,0],s=Array.isArray(d.size)?d.size:[0,0];$('#inspTitle').textContent=selected.dataset.name;body.innerHTML='';const g=document.createElement('div');g.className='group';g.innerHTML='<b>Position & size</b>';body.appendChild(g);field(g,'X',o[0],v=>commit(x=>x.offset=[+v,o[1]]));field(g,'Y',o[1],v=>commit(x=>x.offset=[o[0],+v]));field(g,'Width',s[0],v=>commit(x=>x.size=[+v,s[1]]));field(g,'Height',s[1],v=>commit(x=>x.size=[s[0],+v]));field(g,'Layer',d.layer??0,v=>commit(x=>x.layer=+v));const a=document.createElement('div');a.className='group';a.innerHTML='<b>Anchors</b>';body.appendChild(a);const anchors=['top_left','top_middle','top_right','middle_left','center','middle_right','bottom_left','bottom_middle','bottom_right'];selectField(a,'From',d.anchor_from||'top_left',anchors,v=>commit(x=>x.anchor_from=v));selectField(a,'To',d.anchor_to||'top_left',anchors,v=>commit(x=>x.anchor_to=v));if(d.texture!==undefined){const t=document.createElement('div');t.className='group';t.innerHTML='<b>Texture</b>';body.appendChild(t);field(t,'Path',d.texture,v=>commit(x=>x.texture=v),'text')}if(d.text!==undefined){const t=document.createElement('div');t.className='group';t.innerHTML='<b>Text</b>';body.appendChild(t);field(t,'Value',d.text,v=>commit(x=>x.text=v),'text')}const pre=document.createElement('pre');pre.className='jsonMini';pre.textContent=JSON.stringify(d,null,2);body.appendChild(pre)}
function render(){try{lastGood=parse();const defs={...(lastGood||{}),...(lastGood?.hud_content||{})},controls=lastGood?.hud_content?.controls||[];$('#hud').innerHTML='';for(const item of controls){const k=Object.keys(item)[0];add($('#hud'),ref(item[k],defs),k,$('#game').clientWidth,$('#game').clientHeight,defs)}$('#status').textContent='● LIVE • valid JSON';$('#status').className='ok';if(selected?.dataset.name)requestAnimationFrame(()=>select(selected.dataset.name))}catch(e){$('#status').textContent='● JSON error: '+e.message;$('#status').className='bad'}}
function save(){if(!active)return;const f=files.get(active);if(!f)return;f.blob=new Blob([$('#code').value],{type:'application/json'});f.text=$('#code').value;urls.delete(active);}
function openFile(p){p=lower(p);if(!files.has(p)||!isJson(p))return;save();active=p;if(!open.includes(p))open.push(p);const f=files.get(p);const go=()=>{$('#code').value=f.text||'';$('#opened').textContent=f.name;tabs();render();};if(f.text!==undefined)go();else f.blob.text().then(t=>{f.text=t;go()})}
function tabs(){$('#tabs').innerHTML='';for(const p of open){const t=document.createElement('div');t.className='tab '+(p===active?'active':'');t.textContent=files.get(p)?.name.split('/').pop()||p;t.onclick=()=>openFile(p);$('#tabs').appendChild(t)}}
function tree(){const q=lower($('#search').value),a=[...files.keys()].filter(p=>!q||p.includes(q)).sort();$('#count').textContent=a.length;$('#tree').innerHTML='';if(!a.length){$('#tree').innerHTML='<div class="empty">Load a ZIP or folder.</div>';return}const seen=new Set();for(const p of a){let acc='';p.split('/').forEach((part,i)=>{acc=acc?acc+'/'+part:part;const k=acc+(i===p.split('/').length-1?':f':':d');if(seen.has(k))return;seen.add(k);const r=document.createElement('div');r.className='row '+(i<p.split('/').length-1?'dir':'');r.style.paddingLeft=(7+i*13)+'px';r.textContent=(i<p.split('/').length-1?'▸ ':'▣ ')+part;if(i===p.split('/').length-1&&isJson(p)){r.onclick=()=>openFile(p);if(p===active)r.classList.add('active')}$('#tree').appendChild(r)})}}
function textures(){const q=lower($('#texSearch').value),g=$('#texGrid');g.innerHTML='';[...files.keys()].filter(isImg).filter(p=>!q||p.includes(q)).slice(0,500).forEach(p=>{const d=document.createElement('div');d.className='tex';const i=document.createElement('img');i.src=blobUrl(p);const s=document.createElement('span');s.textContent=p;d.append(i,s);d.onclick=()=>navigator.clipboard?.writeText(p);g.appendChild(d)})}
function loadFiles(arr){revoke();files.clear();open=[];active=null;for(const f of arr){const p=lower(f.webkitRelativePath||f.name);files.set(p,{name:f.webkitRelativePath||f.name,blob:f})}$('#meta').textContent=`${files.size} files`;tree();textures();const hud=[...files.keys()].find(p=>p.endsWith('hud_screen.json'));const first=hud||[...files.keys()].find(isJson);if(first)openFile(first)}
// ZIP reader: supports normal ZIPs with Store (0) and Deflate (8) entries.
function u16(a,o){return a[o]|a[o+1]<<8}function u32(a,o){return (a[o]|a[o+1]<<8|a[o+2]<<16|a[o+3]<<24)>>>0}
async function inflate(data){if(typeof DecompressionStream==='undefined')throw Error('This browser does not support ZIP Deflate. Update iOS/Safari.');const ds=new DecompressionStream('deflate-raw');const stream=new Blob([data]).stream().pipeThrough(ds);return new Uint8Array(await new Response(stream).arrayBuffer())}
async function readZip(file){try{const a=new Uint8Array(await file.arrayBuffer());let eocd=-1;for(let i=a.length-22;i>=Math.max(0,a.length-65558);i--){if(u32(a,i)===0x06054b50){eocd=i;break}}if(eocd<0)throw Error('ZIP end record not found. Is this a real .zip file?');const count=u16(a,eocd+10),cdSize=u32(a,eocd+12),cdOff=u32(a,eocd+16);let p=cdOff,n=0;for(let i=0;i<count;i++){if(u32(a,p)!==0x02014b50)throw Error('Invalid ZIP central directory.');const method=u16(a,p+10),csize=u32(a,p+20),usize=u32(a,p+24),nl=u16(a,p+28),xl=u16(a,p+30),cl=u16(a,p+32),lho=u32(a,p+42);const name=new TextDecoder().decode(a.slice(p+46,p+46+nl));p+=46+nl+xl+cl;if(name.endsWith('/'))continue;if(u32(a,lho)!==0x04034b50)continue;const lnl=u16(a,lho+26),lxl=u16(a,lho+28),start=lho+30+lnl+lxl,raw=a.slice(start,start+csize);let data;if(method===0)data=raw;else if(method===8)data=await inflate(raw);else throw Error(`Unsupported ZIP compression method ${method} for ${name}`);if(usize&&data.length!==usize)throw Error(`ZIP entry size mismatch: ${name}`);files.set(lower(name),{name,blob:new Blob([data])});n++}$('#meta').textContent=`${file.name} • ${n} files`;tree();textures();const hud=[...files.keys()].find(p=>p.endsWith('hud_screen.json'));const first=hud||[...files.keys()].find(isJson);if(first)openFile(first);else alert('ZIP loaded, but no JSON UI file was found.')}catch(e){console.error(e);alert('Не удалось открыть ZIP:\n\n'+e.message)}}
// ZIP writer: Store-only, maximally compatible and no external library.
function crc32(data){let c=~0;for(const b of data){c^=b;for(let k=0;k<8;k++)c=(c>>>1)^((c&1)?0xedb88320:0)}return (~c)>>>0}
function put16(a,v){a.push(v&255,(v>>>8)&255)}function put32(a,v){a.push(v&255,(v>>>8)&255,(v>>>16)&255,(v>>>24)&255)}
async function makeZip(){save();const enc=new TextEncoder(),local=[],central=[];let off=0;for(const [p,f] of files){const name=enc.encode(f.name),data=new Uint8Array(await f.blob.arrayBuffer()),crc=crc32(data);const l=[];put32(l,0x04034b50);put16(l,20);put16(l,0);put16(l,0);put16(l,0);put16(l,0);put32(l,crc);put32(l,data.length);put32(l,data.length);put16(l,name.length);put16(l,0);l.push(...name,...data);local.push(...l);const c=[];put32(c,0x02014b50);put16(c,20);put16(c,20);put16(c,0);put16(c,0);put16(c,0);put16(c,0);put32(c,crc);put32(c,data.length);put32(c,data.length);put16(c,name.length);put16(c,0);put16(c,0);put16(c,0);put16(c,0);put32(c,0);put32(c,off);c.push(...name);central.push(...c);off+=l.length}const cdOff=off,cdSize=central.length,e=[];put32(e,0x06054b50);put16(e,0);put16(e,0);put16(e,files.size);put16(e,files.size);put32(e,cdSize);put32(e,cdOff);put16(e,0);return new Blob([new Uint8Array([...local,...central,...e])],{type:'application/zip'})}
$('#zipIn').onchange=e=>{const f=e.target.files?.[0];if(f)readZip(f)};$('#folderIn').onchange=e=>{if(e.target.files?.length)loadFiles([...e.target.files])};$('#search').oninput=tree;$('#texSearch').oninput=textures;$('#format').onclick=()=>{try{$('#code').value=JSON.stringify(parse(),null,2);save();render()}catch{}};$('#save').onclick=()=>{save();tree();$('#status').textContent='Saved in memory'};$('#export').onclick=async()=>{if(!files.size)return alert('Сначала загрузи resource pack.');const b=await makeZip(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='MCBE_UI_Studio_edited.zip';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)};$('#code').addEventListener('input',()=>{save();clearTimeout(timer);timer=setTimeout(render,120)});$('#code').addEventListener('scroll',()=>$('#nums').scrollTop=$('#code').scrollTop);$('#code').addEventListener('keyup',()=>{const s=$('#code').value.slice(0,$('#code').selectionStart),ln=s.split('\n').length,col=s.length-s.lastIndexOf('\n');$('#cursor').textContent=`Ln ${ln}, Col ${col}`});$('#full').onclick=()=>$('#game').requestFullscreen?.();$('#close').onclick=()=>$('#inspector').classList.remove('open');$('#game').addEventListener('pointerdown',e=>{if(e.target===$('#game')||e.target.classList.contains('sky')||e.target.classList.contains('ground')||e.target.classList.contains('cross')){$('#inspector').classList.remove('open');$('#hud').querySelectorAll('.selected').forEach(x=>x.classList.remove('selected'));selected=null}});document.querySelectorAll('.sideTabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.sideTabs button').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.sidePanel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#'+b.dataset.side).classList.add('active')});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#stage').className='stage '+b.dataset.mode});for(const [id,out] of [['hp','hpv'],['food','foodv'],['armor','armorv']])$('#'+id).oninput=e=>{$('#'+out).textContent=e.target.value;render()};$('#title').oninput=render;$('#action').oninput=render;tree();
</script></body></html>
