<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MCBE UI Studio</title><link rel="stylesheet" href="/style.css"></head><body>
<header><div class="brand"><b>MCBE UI Studio</b><small>Bedrock JSON UI Live Editor</small></div><div class="actions"><label>📦 Load ZIP<input id="zip" type="file" accept=".zip"></label><label>📁 Load folder<input id="folder" type="file" webkitdirectory directory multiple></label><button id="export">⬇ Export pack</button></div></header>
<main><aside><nav><button class="active" data-tab="files">Files</button><button data-tab="textures">Textures</button></nav><section id="files"><input id="search" placeholder="Search files…"><div id="tree"></div></section><section id="textures"><input id="texsearch" placeholder="Search textures…"><div id="grid"></div></section><footer id="meta">No pack loaded</footer></aside>
<section class="editor"><div class="bar"><div id="tabs"></div><div><button id="format">Format</button><button id="save">Save</button></div></div><div class="editwrap"><pre id="nums">1</pre><textarea id="code" spellcheck="false"></textarea></div><div class="status"><span id="status">Ready</span><span id="cursor">Ln 1, Col 1</span></div></section>
<section class="preview"><div class="bar"><b>Live Preview</b><span id="file"></span><div class="devices"><button class="active" data-device="phone">iPhone</button><button data-device="tablet">Tablet</button><button data-device="desktop">Desktop</button><button id="full">⛶</button></div></div><div id="stage" class="stage phone"><div id="game"><div class="sky"></div><div class="world"><i></i></div><div id="hud"></div></div></div><div class="sim"><b>Sim</b><label>Title <input id="title"></label><label>Actionbar <input id="action" value="HITMARKER"></label><label>❤ <input id="hp" type="range" min="0" max="20" value="18"></label><label>🍗 <input id="food" type="range" min="0" max="20" value="16"></label><label>🛡 <input id="armor" type="range" min="0" max="20" value="8"></label></div></section></main><script type="module" src="/app.js"></script></body></html>
